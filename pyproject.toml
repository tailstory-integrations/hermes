[project]
name = "tailstory-hermes"
version = "1.0.2"
description = "One interface over the shipping carriers' SDKs"
authors = [
    { name = "Bradley Reynolds", email = "bradley.reynolds@tailstory.dev" },
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["pydantic>=2.12.0"]

[project.optional-dependencies]
ups = ["tailstory-ups>=1.0.0"]

[project.urls]
repository = "https://github.com/tailstory/hermes"
documentation = "https://docs.tailstory.dev/hermes/"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nox>=2026.7.11",
    "prek>=0.4.11",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "ty>=0.0.101",
]
docs = [
    # autoapi and linkcode import every module, the carrier adapters included.
    "tailstory-hermes[ups]",
    "sphinx>=7.4.4",
    # Theme
    "furo>=2024.5.6",
    # Extensions
    "sphinx-autoapi>=3.1.2",
    "releases>=2.1.1",
]
tests = [
    "tailstory-hermes[ups]",
    "coverage>=7.6.1",
    "pytest>=9.0.0",
    # Extensions
    "pytest-randomly>=3.15.0",
]

[tool.uv]
exclude-newer = "P7D"

[tool.uv.exclude-newer-package]
tailstory-ups = false

[tool.uv.build-backend]
module-name = "hermes"

[tool.ruff]
target-version = "py314"
line-length = 120
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # (Trailing comma missing) - The formatter owns trailing commas
    "CPY001", # (Missing copyright notice at top of file) - No license
]

[tool.ruff.lint.extend-per-file-ignores]
"docs/*" = [
    "INP001", # (File `docs/conf.py` is part of an implicit namespace package. Add an `__init__.py`.) - Docs are not modules
]
"tests/*" = [
    "S101", # (Use of `assert` detected) - Yes, that's the point
    "PLR2004", # (Magic value used in comparison) - Tests compare against fixture values
]

[tool.ruff.lint.isort]
known-first-party = ["hermes"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
plugins = ["pydantic.mypy"]
cache_dir = ".cache/mypy"

[tool.coverage.run]
source = ["hermes"]
data_file = ".cache/coverage/.coverage"

[tool.pytest.ini_options]
addopts = "--strict-markers"
cache_dir = ".cache/pytest"
